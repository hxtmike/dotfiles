"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$time\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$direnv\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$git_branch\
$git_status\
[](fg:sapphire bg:lavender)\
$cmd_duration\
[ ](fg:lavender)\
$jobs\
$status\
$line_break\
$character"""

palette = 'monokai'

# Raised from the 500ms default. [direnv], [python], and [git_status] (which
# execs `git status --porcelain`) spawn subprocesses, and on a cold start (first
# prompt of the day, or after a long idle) macOS has to page in the binary and
# run its Gatekeeper checks, which can take seconds and drops the segment with
# a timeout warning. This only delays the prompt when a command is genuinely
# slow; the usual warm-cache case is unaffected.
command_timeout = 5000

# Raised from the 30ms default. Listing the current directory for module
# detection takes ~26ms even on a warm cache, so any cold-start I/O tips it over
# and prints "Scanning current directory timed out".
scan_timeout = 200

[os]
disabled = false
style = "bg:red fg:crust"
format = '[$symbol ]($style)'

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[time]
disabled = false
time_format = "%R "
style = "bg:red"
format = '[  $time](bg:red fg:crust)($style)'


[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Development" = "󰲋 "

[direnv]
disabled = false
style = "bg:yellow"
format = '[[ $symbol .env ](fg:crust bg:yellow)]($style)'
symbol = "󰐣"

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
version_format = "${major}.${minor}"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[git_branch]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol $branch ](fg:crust bg:sapphire)]($style)'

[git_status]
style = "bg:sapphire"
format = '[[($all_status$ahead_behind )](fg:crust bg:sapphire)]($style)'

[cmd_duration]
show_milliseconds = true
format = '[[  $duration ](fg:crust bg:lavender)]($style)'
style = "bg:lavender"
disabled = false
show_notifications = true
min_time = 1000
min_time_to_notify = 30000

[jobs]
format = '[󰔟 $number](bold fg:yellow) '

[status]
disabled = false
format = '[✘ $status](bold fg:red) '

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[palettes.monokai]
red      = "#F92672"
peach    = "#FD971F"
yellow   = "#E6DB74"
green    = "#A6E22E"
sapphire = "#66D9EF"
lavender = "#AE81FF"
crust    = "#272822"
maroon   = "#F92672"
mauve    = "#AE81FF"
teal     = "#66D9EF"
